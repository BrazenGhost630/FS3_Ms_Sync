spring.application.name=ms_sync

# Puerto del servidor (usamos 8083 para no chocar con Auth (8080) ni Weather (8082))
server.port=8083

# Configuración de MySQL para Laragon (puerto por defecto 3306)
spring.datasource.url=jdbc:mysql://localhost:3306/auth_db
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Clave secreta JWT (DEBE ser exactamente la misma que tienes configurada en tu MS de Auth)
jwt.secret=bXlTZWNyZXRLZXlGb3JKV1RUaGF0SXNBdExlYXN0MjU2Qml0c0xvbmdGb3JIUzI1NkFsZ29yaXRobUFuZFNob3VsZEJlQmFzZTY0RW5jb2RlZA==

# Configuración de almacenamiento de imágenes
app.storage.location=./wardrobe-images
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CONFIGURACIÓN CORS
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=false
